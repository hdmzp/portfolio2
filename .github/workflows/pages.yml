name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/portfolio-webpage-structure-ngdmtz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 — 연속 푸시 시 마지막 것만 반영
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # Pages 최초 활성화는 저장소 Settings → Pages 에서 한 번 해줘야 합니다.
      # (워크플로 토큰에는 Pages 생성 권한이 없어 자동 활성화가 불가능)
      - name: Pages 설정 확인
        uses: actions/configure-pages@v5

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
